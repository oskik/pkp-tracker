<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PKP Tracker - Mapa Podróży</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        #map { z-index: 1; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <div class="max-w-4xl mx-auto py-10 px-4">
        <!-- Header -->
        <header class="mb-10 text-center">
            <h1 class="text-4xl font-bold text-indigo-900 leading-tight">PKP Tracker - Mapa Podróży</h1>
            <p class="text-gray-500 mt-2">Dziennik podróży z interaktywną wizualizacją tras</p>
        </header>

        <!-- Adding form -->
        <section class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 mb-10">
            <h2 class="text-xl font-semibold mb-6 text-gray-800">Gdzie dziś podróżowałeś?</h2>
            <form id="tripForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Z (Stacja)</label>
                    <input type="text" id="start_station" list="station_list" required autocomplete="off" placeholder="Zacznij pisać (np. War...)"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border bg-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Do (Stacja)</label>
                    <input type="text" id="end_station" list="station_list" required autocomplete="off" placeholder="Zacznij pisać (np. Kra...)"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border bg-white">
                </div>

                <!-- List of availible station for the web -->
                <datalist id="station_list">
                    <option value="Warszawa"></option>
                    <option value="Kraków"></option>
                    <option value="Gdańsk"></option>
                    <option value="Gdynia"></option>
                    <option value="Sopot"></option>
                    <option value="Poznań"></option>
                    <option value="Wrocław"></option>
                    <option value="Katowice"></option>
                    <option value="Szczecin"></option>
                </datalist>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Data</label>
                    <input type="date" id="travel_date" min="1900-01-01" max="2026-12-31" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Pociąg</label>
                    <select id="train_type" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
                        <option value="EIP">Pendolino (EIP)</option>
                        <option value="IC">InterCity (IC)</option>
                        <option value="TLK">TLK</option>
                        <option value="REGIO">REGIO</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Ocena (1-5)</label>
                    <input type="number" id="rating" min="1" max="5" value="5"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
                </div>
                <div class="flex items-end">
                    <button type="submit" 
                        class="w-full bg-indigo-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-indigo-700 transition duration-200 shadow-lg shadow-indigo-200">
                        Dodaj do dziennika
                    </button>
                </div>
            </form>
        </section>

        <!-- Map -->
        <section class="mb-10">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Mapa Twoich Tras</h2>
            <div id="map" class="h-96 w-full rounded-2xl shadow-md border-4 border-white"></div>
        </section>

        <!-- Stats -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 text-center">
                <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Suma podróży</p>
                <p id="stat-total" class="text-3xl font-extrabold text-indigo-600">0</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 text-center">
                <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Ulubiony pociąg</p>
                <p id="stat-fav" class="text-2xl font-extrabold text-indigo-600">-</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 text-center">
                <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Średnia ocena</p>
                <p id="stat-avg" class="text-3xl font-extrabold text-indigo-600">0.0</p>
            </div>
        </section>

        <!-- Creative twist: Percent of Transiberian railway -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-10">
            <div class="flex justify-between items-end mb-4">
                <div>
                    <h3 class="text-lg font-bold text-gray-800">Wyzwanie Transsyberyjskie</h3>
                    <p class="text-sm text-gray-500">Cel: 9 289 km</p>
                </div>
                <div class="text-right">
                    <span class="text-2xl font-extrabold text-purple-600" id="stat-trans-text">0%</span>
                </div>
            </div>
            <!-- Transiberian track -->
            <div class="w-full h-4 bg-gray-200 rounded-full relative">
                <div id="trans-bar-fill" class="h-4 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-full absolute top-0 left-0 transition-all duration-1000 ease-out" style="width: 0%;">
                    <span class="absolute -right-4 -top-2.5 text-2xl drop-shadow-md inline-block -scale-x-100">🚂</span>
                </div>
            </div>
        </section>

        <!-- Trip list -->
        <section>
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-800">Historia Relacji</h2>
                <span id="tripCount" class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-sm font-medium">0 podróży</span>
            </div>
            <div id="tripList" class="grid grid-cols-1 gap-4">
            </div>
        </section>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const API_URL = 'http://localhost:8000/trips';

        // 1. Coordinates dict (Geocoding MVP)
        const CITY_COORDS = {
            'warszawa': [52.2297, 21.0122],
            'kraków': [50.0647, 19.9450],
            'krakow': [50.0647, 19.9450],
            'gdańsk': [54.3520, 18.6466],
            'gdansk': [54.3520, 18.6466],
            'gdynia': [54.5189, 18.5305],
            'sopot': [54.4416, 18.5601],
            'poznań': [52.4064, 16.9252],
            'poznan': [52.4064, 16.9252],
            'wrocław': [51.1079, 17.0385],
            'wroclaw': [51.1079, 17.0385],
            'katowice': [50.2649, 19.0238],
            'szczecin': [53.4289, 14.5530]
        };

        // 2. Map init
        const map = L.map('map', {
            zoomSnap: 0.25,    // Better granularity
            zoomDelta: 0.5,     // Less agressive scroll
            renderer: L.svg({ padding: 1.0 }) // Bigger render distance
        }).setView([52.0688, 19.4797], 5.75); 

        // Esri servers, they do not block local host
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ',
            maxZoom: 18
        }).addTo(map);

        // Two layers for availible trips and completed trips
        const networkLayer = L.layerGroup().addTo(map); // Availible is grey
        const journeyLayer = L.layerGroup().addTo(map); // Completed is green

        // 3. All possible connections in grey
        function drawPossibleNetwork() {
            networkLayer.clearLayers();
            const cities = Object.keys(CITY_COORDS);
            
            // Simple all to all connection
            for (let i = 0; i < cities.length; i++) {
                for (let j = i + 1; j < cities.length; j++) {
                    const start = CITY_COORDS[cities[i]];
                    const end = CITY_COORDS[cities[j]];
                    
                    if (start && end) {
                    L.polyline([start, end], {
                        color: '#d1d5db', // gray-300
                        weight: 1,
                        opacity: 0.4,
                        interactive: false
                    }).addTo(networkLayer);
                    }
                }
            }
        }
        // 4. Getting the data
        async function fetchTrips() {
            try {
                const response = await fetch(API_URL);
                const trips = await response.json();
                renderTrips(trips);
                updateMap(trips);
            } catch (error) {
                console.error('Błąd:', error);
            }
        }

        // 5. Rendering the stats and trip list
        function renderTrips(trips) {
            const container = document.getElementById('tripList');
            const total = trips.length;

            // a. Statistics computation
            const avgRating = total > 0 
                ? (trips.reduce((acc, t) => acc + (t.rating || 0), 0) / total).toFixed(1) 
                : "0.0";

            // Most common train type
            const trainCounts = trips.reduce((acc, t) => {
                if (t.train_type) acc[t.train_type] = (acc[t.train_type] || 0) + 1;
                return acc;
            }, {});

            const favTrain = Object.keys(trainCounts).reduce((a, b) => trainCounts[a] > trainCounts[b] ? a : b, "-");
            
            let totalKm = 0;
            trips.forEach(trip => {
                const start = trip.start_station.toLowerCase().trim();
                const end = trip.end_station.toLowerCase().trim();

                if (CITY_COORDS[start] && CITY_COORDS[end]) {
                    const distanceInMeters = map.distance(CITY_COORDS[start], CITY_COORDS[end]);
                    totalKm += (distanceInMeters / 1000) * 1.2;
                }
            });
            

            // Percent of Transsiberian railway (9289 km)
            const transSiberianKm = 9289;
            const transPercent = totalKm > 0 ? ((totalKm / transSiberianKm) * 100).toFixed(1) : "0";
            const safePercent = Math.min(parseFloat(transPercent), 100); // Blocking at 100%
            
            // b. HTML injection
            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-avg').innerText = avgRating;
            document.getElementById('stat-fav').innerText = favTrain;
            
            document.getElementById('tripCount').innerText = `${trips.length} podróży`;

            document.getElementById('stat-trans-text').innerText = transPercent + "%";
            document.getElementById('trans-bar-fill').style.width = safePercent + "%";

            container.innerHTML = trips.map(trip => `
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
                    <div>
                        <div class="text-xs font-bold text-indigo-500 uppercase tracking-wider">${trip.train_type || 'PKP'} • ${trip.travel_date || 'Brak daty'}</div>
                        <h3 class="text-lg font-bold text-gray-800">${trip.start_station} → ${trip.end_station}</h3>
                        <div class="text-yellow-400 text-sm">${'★'.repeat(trip.rating || 0)}${'☆'.repeat(5 - (trip.rating || 0))}</div>
                    </div>
                    <button onclick="deleteTrip(${trip.id})" class="text-gray-300 hover:text-red-500 transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-4v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </div>
            `).reverse().join(''); // Newest on top
        }

        // 6. Map update
        function updateMap(trips) {
            journeyLayer.clearLayers();
            drawPossibleNetwork();

            trips.forEach(trip => {
                const start = trip.start_station.toLowerCase().trim();
                const end = trip.end_station.toLowerCase().trim();

                if (CITY_COORDS[start] && CITY_COORDS[end]) {
                    const startCoord = CITY_COORDS[start];
                    const endCoord = CITY_COORDS[end];

                    // Finishied trip in green
                    L.polyline([startCoord, endCoord], {
                        color: '#10b981', // emerald-500 
                        weight: 4,
                        opacity: 1.0,
                        lineCap: 'round'
                    }).addTo(journeyLayer);

                    // Cities markers
                    L.circleMarker(startCoord, { radius: 4, color: '#059669', fillColor: '#fff', fillOpacity: 1 }).addTo(journeyLayer);
                    L.circleMarker(endCoord, { radius: 4, color: '#059669', fillColor: '#fff', fillOpacity: 1 }).addTo(journeyLayer);
                }
            });
        }

        // 7. Adding trips
        document.getElementById('tripForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const startVal = document.getElementById('start_station').value.trim().toLowerCase();
            const endVal = document.getElementById('end_station').value.trim().toLowerCase();

            // Checking if they are in the dict
            if (!CITY_COORDS[startVal] || !CITY_COORDS[endVal]) {
                alert("Nieznana stacja! Proszę wybrać miasto z podpowiadanej listy.");
                return; 
            }
            const payload = {
                start_station: document.getElementById('start_station').value,
                end_station: document.getElementById('end_station').value,
                travel_date: document.getElementById('travel_date').value,
                train_type: document.getElementById('train_type').value,
                rating: parseInt(document.getElementById('rating').value)
            };

            try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        document.getElementById('tripForm').reset();
                        await fetchTrips();
                    } else {
                        const error = await response.json();
                        console.error("Błąd serwera:", error);
                        alert("Serwer odrzucił dane. Sprawdź konsolę (F12).");
                    }
                } catch (err) {
                    console.error("Błąd sieci:", err);
                }
            });

        // 8. Deleting
        async function deleteTrip(id) {
            if (confirm('Usunąć tę trasę?')) {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                fetchTrips();
            }
        }

        // Start
        fetchTrips();
    </script>
</body>
</html>
